# One-click deploy on Render (render.com): one service serves the API and the web console at /.
services:
  - type: web
    name: sentinelai-api
    runtime: docker
    plan: starter        # persistent disks need a paid plan; drop `disk` to use the free plan
    healthCheckPath: /health
    envVars:
      - key: SENTINEL_API_KEYS
        generateValue: true
    disk:
      name: sentinel-data
      mountPath: /app/var
      sizeGB: 1
