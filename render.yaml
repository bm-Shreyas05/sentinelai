# Free deploy on Render (render.com): New -> Blueprint -> this repo. One web service serves the API
# and the web console at /. The free plan has no persistent disk, so the database resets on every
# restart or redeploy; the model is baked into the image and demo traffic refills the console.
services:
  - type: web
    name: sentinelai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SENTINEL_API_KEYS   # random secret; copy it from the service's Environment tab to sign in
        generateValue: true
      - key: SENTINEL_DEMO
        value: "1"
