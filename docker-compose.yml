# docker compose up --build   → console on http://localhost:8000, API docs at /docs
# Set SENTINEL_DEMO=1 in .env to stream simulated payments into the console.
services:
  api:
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
    volumes: [sentinel-data:/app/var]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 10
      start_period: 90s
volumes:
  sentinel-data:
