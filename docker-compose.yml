# docker compose up --build   → API on :8000 (docs at /docs), dashboard on :8501
services:
  api:
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
    volumes: [sentinel-data:/app/var]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 10
      start_period: 90s
  dashboard:
    build: .
    env_file: [.env]
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports: ["8501:8501"]
    volumes: [sentinel-data:/app/var]
    depends_on:
      api: { condition: service_healthy }
volumes:
  sentinel-data:
